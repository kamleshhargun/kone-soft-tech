<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harsidhi Ventures - Enterprise Logistics Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --bg-body: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --accent-primary: #38bdf8;
            --accent-success: #34d399;
            --accent-warning: #fbbf24;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --radius-xl: 20px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; padding-bottom: 30px; }

        /* Top Header Navigation */
        .top-nav { background: var(--panel-bg); border-bottom: 1px solid var(--panel-border); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .nav-brand { font-size: 18px; font-weight: 800; color: var(--accent-primary); letter-spacing: 0.5px; display: flex; align-items: center; gap: 10px; }
        .nav-badge { background: #0284c7; color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }

        .container { max-width: 1280px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; }

        /* Analytics Grid Section */
        .analytics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        .stat-card { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
        .stat-val { font-size: 24px; font-weight: 800; color: #fff; }
        .stat-title { font-size: 12px; color: var(--text-sub); font-weight: 600; text-transform: uppercase; }

        /* Scanning Workspace Layout */
        .grid-split { display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
        .panel { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: var(--radius-xl); padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--panel-border); padding-bottom: 12px; }

        .mode-selector { display: flex; gap: 10px; }
        .btn-mode { flex: 1; height: 50px; border-radius: 14px; border: 2px solid; background: transparent; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .btn-pickup { border-color: var(--accent-primary); color: var(--accent-primary); }
        .btn-return { border-color: var(--accent-success); color: var(--accent-success); }
        .btn-pickup.active { background: var(--accent-primary); color: #0f172a; }
        .btn-return.active { background: var(--accent-success); color: #0f172a; }

        /* Scanner Box & Mobile Adjustments */
        .scan-box { display: none; flex-direction: column; gap: 12px; background: #0f172a; border-radius: 16px; padding: 16px; border: 1px solid var(--panel-border); }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; border: 2px dashed var(--accent-primary); display: none; }
        .input-dark { width: 100%; height: 48px; background: #1e293b; border: 1px solid var(--panel-border); border-radius: 12px; padding: 0 16px; color: #fff; font-size: 14px; outline: none; }
        .input-dark:focus { border-color: var(--accent-primary); }

        .btn-action { height: 44px; border-radius: 12px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-save { background: var(--accent-success); color: #0f172a; }
        .btn-reset { background: #ef4444; color: #fff; }

        /* Statement Box & Exchange Table */
        .statement-card { background: #0f172a; border-left: 4px solid var(--accent-primary); padding: 8px 12px; border-radius: 6px; font-size: 12px; color: #cbd5e1; margin-top: 4px; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; }
        .badge-req { background: #f59e0b; color: #0f172a; }
        .badge-disp { background: #38bdf8; color: #0f172a; }
        .badge-comp { background: #34d399; color: #0f172a; }

        /* Non-Blur Circular Percentage Loader Modal */
        #loaderContainer { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); z-index: 99999; align-items: center; justify-content: center; }
        .circle-loader-box { background: var(--panel-bg); border: 1px solid var(--panel-border); border-radius: 24px; padding: 30px; display: flex; flex-direction: column; align-items: center; gap: 14px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .circle-svg { width: 90px; height: 90px; transform: rotate(-90deg); }
        .circle-bg { fill: none; stroke: var(--panel-border); stroke-width: 8; }
        .circle-progress { fill: none; stroke: var(--accent-primary); stroke-width: 8; stroke-dasharray: 251; stroke-dashoffset: 251; transition: stroke-dashoffset 0.1s ease; stroke-linecap: round; }
        .percent-text { font-size: 18px; font-weight: 800; color: #fff; }

        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #fff; color: #0f172a; padding: 12px 24px; border-radius: 30px; font-weight: 700; font-size: 13px; z-index: 9999; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

        @media (max-width: 900px) {
            .grid-split { grid-template-columns: 1fr; }
            .container { padding: 12px; }
            .analytics-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

<body>

    <div class="top-nav">
        <div class="nav-brand">⚡ HARSIDHI ERP SCANNER</div>
        <div class="nav-badge">V2.0 SaaS Edition</div>
    </div>

    <div class="container">

        <!-- Analytics Metric Cards Row -->
        <div class="analytics-grid">
            <div class="stat-card"><div class="stat-val" id="cntTodayPickup">0</div><div class="stat-title">Today Pickup</div></div>
            <div class="stat-card"><div class="stat-val" id="cntTodayReturn">0</div><div class="stat-title">Today Return</div></div>
            <div class="stat-card"><div class="stat-val" id="cntYestPickup">0</div><div class="stat-title">Yesterday Pickup</div></div>
            <div class="stat-card"><div class="stat-val" id="cntYestReturn">0</div><div class="stat-title">Yesterday Return</div></div>
            <div class="stat-card"><div class="stat-val" id="cntMonthTotal" style="color:var(--accent-primary)">0</div><div class="stat-title">This Month Total</div></div>
            <div class="stat-card"><div class="stat-val" id="cntTotalLifetime" style="color:var(--accent-success)">0</div><div class="stat-title">Lifetime Total</div></div>
        </div>

        <!-- Scanning Operations Grid -->
        <div class="grid-split">
            <div class="panel">
                <div class="panel-header">
                    <div style="font-weight: 800; font-size: 16px;">LOGISTICS OPERATIONAL CONSOLE</div>
                </div>

                <div class="mode-selector">
                    <button id="btnPickup" class="btn-mode btn-pickup" onclick="setMode('Pickup')">📦 Pickup Mode</button>
                    <button id="btnReturn" class="btn-mode btn-return" onclick="setMode('Return')">↩️ Return Mode</button>
                </div>

                <div id="scanBox" class="scan-box">
                    <div style="display:flex; gap:10px;">
                        <button class="btn-action" style="flex:1; background:#0284c7; color:#fff;" onclick="startCamera()">📷 Toggle Camera</button>
                        <button class="btn-action" style="flex:1; background:#334155; color:#fff;" onclick="focusInput()">⌨ Focus Keyboard</button>
                    </div>

                    <div id="reader"></div>

                    <input id="awbInput" class="input-dark" placeholder="Scan AWB / Enter Code">
                    <input id="orderInput" class="input-dark" placeholder="Shopify Order ID" style="display:none;">

                    <div id="resultPreview" style="display:none; padding:12px; background:#1e293b; border-radius:12px; font-size:13px; line-height:1.6;"></div>

                    <div style="display:flex; gap:10px;">
                        <button class="btn-action btn-save" style="flex:1;" onclick="saveEntry()">Save Entry</button>
                        <button class="btn-action btn-reset" style="flex:1;" onclick="resetConsole()">Reset</button>
                    </div>
                </div>
            </div>

            <!-- Recent Scans Stream -->
            <div class="panel">
                <div class="panel-header"><div style="font-weight:800; font-size:14px;">RECENT LOGS</div></div>
                <div id="recentLogs" style="display:flex; flex-direction:column; gap:8px;">
                    <div style="text-align:center; color:var(--text-sub); font-size:12px; padding:20px 0;">No active logs</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Circular Percentage Loader Overlay (No Screen Blur) -->
    <div id="loaderContainer">
        <div class="circle-loader-box">
            <svg class="circle-svg">
                <circle class="circle-bg" cx="45" cy="45" r="40"></circle>
                <circle id="circleProgress" class="circle-progress" cx="45" cy="45" r="40"></circle>
            </svg>
            <div class="percent-text" id="percentText">0%</div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbz0TleERAG7sZmMTgtokHF2ZO7W66rP03PcELfWHuh8j91nJCNNCz_r6acj3F_ktPeo/exec";

        let currentMode = "";
        let currentTracking = null;
        let html5QrCode = null;

        function showCircularLoader() {
            document.getElementById("loaderContainer").style.display = "flex";
            let progress = 0;
            const circle = document.getElementById("circleProgress");
            const percentText = document.getElementById("percentText");

            const interval = setInterval(() => {
                progress += 10;
                const offset = 251 - (251 * progress) / 100;
                circle.style.strokeDashoffset = offset;
                percentText.innerText = progress + "%";

                if (progress >= 100) {
                    clearInterval(interval);
                    setTimeout(() => { document.getElementById("loaderContainer").style.display = "none"; }, 150);
                }
            }, 30);
        }

        function fetchDashboardCounts() {
            showCircularLoader();
            fetch(`${API_URL}?action=getDashboardCounts`)
                .then(res => res.json())
                .then(d => {
                    if (d.success) {
                        document.getElementById("cntTodayPickup").innerText = d.todayPickup || 0;
                        document.getElementById("cntTodayReturn").innerText = d.todayReturn || 0;
                        document.getElementById("cntYestPickup").innerText = d.yesterdayPickup || 0;
                        document.getElementById("cntYestReturn").innerText = d.yesterdayReturn || 0;
                        document.getElementById("cntMonthTotal").innerText = d.monthTotal || 0;
                        document.getElementById("cntTotalLifetime").innerText = d.totalLifetime || 0;
                        renderRecentLogs(d.recentScans || []);
                    }
                });
        }

        function renderRecentLogs(logs) {
            const container = document.getElementById("recentLogs");
            if (!logs || logs.length === 0) return;
            container.innerHTML = logs.map(l => `
                <div style="background:#0f172a; padding:10px 12px; border-radius:10px; border-left:4px solid ${l.type.toLowerCase() === 'pickup' ? 'var(--accent-primary)' : 'var(--accent-success)'}; display:flex; justify-between; align-items:center;">
                    <div><b>${l.awb}</b><br><span style="font-size:11px; color:var(--text-sub);">${l.orderId || 'Manual'}</span></div>
                    <div style="text-align:right;"><b style="font-size:12px;">${l.type}</b><br><span style="font-size:10px; color:var(--text-sub);">${l.time}</span></div>
                </div>
            `).join('');
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById("scanBox").style.display = "flex";
            document.getElementById("btnPickup").classList.remove("active");
            document.getElementById("btnReturn").classList.remove("active");

            if (mode === "Pickup") document.getElementById("btnPickup").classList.add("active");
            else document.getElementById("btnReturn").classList.add("active");

            focusInput();
        }

        function focusInput() { document.getElementById("awbInput").focus(); }

        async function startCamera() {
            try {
                if (html5QrCode) { await stopCamera(); return; }
                document.getElementById("reader").style.display = "block";
                html5QrCode = new Html5Qrcode("reader");

                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 20, qrbox: { width: 250, height: 130 } },
                    (text) => {
                        document.getElementById("awbInput").value = text;
                        stopCamera();
                        trackShipment();
                    }
                );
            } catch (e) { toast("Camera Access Error"); }
        }

        async function stopCamera() {
            if (html5QrCode) { await html5QrCode.stop(); html5QrCode = null; }
            document.getElementById("reader").style.display = "none";
        }

        document.getElementById("awbInput").addEventListener("keydown", (e) => {
            if (e.key === "Enter") { e.preventDefault(); trackShipment(); }
        });

        async function trackShipment() {
            const awb = document.getElementById("awbInput").value.trim();
            if (!awb) return toast("Enter AWB");

            showCircularLoader();
            try {
                const res = await fetch(`${API_URL}?action=trackShipment&awb=${encodeURIComponent(awb)}`);
                const data = await res.json();

                if (data && data.success) {
                    currentTracking = data;
                    document.getElementById("resultPreview").style.display = "block";
                    document.getElementById("resultPreview").innerHTML = `✅ <b>Verified:</b> ${data.courier} | Order: ${data.orderId || 'N/A'}`;
                    document.getElementById("orderInput").value = data.orderId || "";
                } else {
                    document.getElementById("resultPreview").style.display = "block";
                    document.getElementById("resultPreview").innerHTML = `⚠️ <b>Manual Mode Needed</b>`;
                }
                document.getElementById("orderInput").style.display = "block";
            } catch (e) {}
        }

        async function saveEntry() {
            if (!currentMode) return toast("Select Mode First");
            const awb = document.getElementById("awbInput").value.trim();
            if (!awb) return toast("AWB Missing");

            showCircularLoader();
            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: "saveEntry",
                        payload: {
                            type: currentMode, awb, orderId: document.getElementById("orderInput").value.trim(),
                            courier: currentTracking?.courier || "MANUAL", status: currentTracking?.status || "Pending"
                        }
                    })
                });
                const data = await res.json();
                if (data.duplicate) { toast(data.message); return; }
                toast("Saved!"); resetConsole(); fetchDashboardCounts();
            } catch (e) {}
        }

        function resetConsole() {
            stopCamera();
            document.getElementById("awbInput").value = "";
            document.getElementById("orderInput").value = "";
            document.getElementById("orderInput").style.display = "none";
            document.getElementById("resultPreview").style.display = "none";
        }

        function toast(msg) {
            const t = document.createElement("div"); t.className = "toast"; t.innerText = msg;
            document.body.appendChild(t); setTimeout(() => t.remove(), 2500);
        }

        window.onload = fetchDashboardCounts;
    </script>
</body>

</html>
