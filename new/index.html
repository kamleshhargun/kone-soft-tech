<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Harsidhi Ventures - iOS Scan System</title>
    <!-- Apple SF Pro Font inspired styling -->
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f2f2f7; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 15px; color: #1c1c1e; }
        
        /* Fixed iOS Container 500x1000 px Dimension */
        .ios-wrapper { width: 100%; max-width: 500px; min-height: 900px; height: 1000px; max-height: 90vh; background: #ffffff; border-radius: 38px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0,0,0,0.05); border: 1px solid rgba(225, 225, 230, 0.8); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        
        /* View Views Switcher */
        .page-view { display: flex; flex-direction: column; width: 100%; height: 100%; position: absolute; inset: 0; transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.25s ease; background: #ffffff; }
        .page-hidden-right { transform: translateX(100%); opacity: 0; pointer-events: none; }
        .page-hidden-left { transform: translateX(-30%); opacity: 0; pointer-events: none; }

        /* iOS Header Bar */
        .ios-header { height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid rgba(60, 60, 67, 0.12); background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 10; }
        .ios-title { font-size: 17px; font-weight: 700; color: #000000; letter-spacing: -0.4px; }
        
        .ios-btn-icon { background: #f2f2f7; border: none; color: #007aff; font-weight: 600; font-size: 14px; padding: 8px 14px; border-radius: 20px; cursor: pointer; transition: background 0.2s, transform 0.1s; display: inline-flex; align-items: center; gap: 4px; }
        .ios-btn-icon:active { background: #e5e5ea; transform: scale(0.96); }

        /* Index View Style */
        .index-content { padding: 24px 20px; display: flex; flex-direction: column; gap: 20px; height: 100%; overflow-y: auto; }
        .ios-section-label { font-size: 13px; font-weight: 600; text-transform: uppercase; color: #8e8e93; letter-spacing: -0.1px; margin-left: 4px; }

        /* Interactive iOS Clickable Card (500x1000 constrained bounds) */
        .ios-dashboard-card { background: linear-gradient(135deg, #ffffff 0%, #f9f9fb 100%); border: 1px solid #e5e5ea; border-radius: 24px; padding: 22px; cursor: pointer; transition: all 0.25s ease; box-shadow: 0 4px 18px rgba(0, 0, 0, 0.03); display: flex; flex-direction: column; gap: 18px; position: relative; }
        .ios-dashboard-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06); border-color: #007aff; }
        .ios-dashboard-card:active { transform: scale(0.98); }

        .card-top-row { display: flex; align-items: center; justify-content: space-between; }
        .card-title { font-size: 18px; font-weight: 700; color: #1c1c1e; }
        .card-badge-open { font-size: 12px; font-weight: 600; color: #007aff; background: #e5f1ff; padding: 4px 10px; border-radius: 12px; }

        /* Metric Grid */
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .metric-box { background: #ffffff; border: 1px solid #f0f0f5; padding: 14px; border-radius: 18px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .metric-box.pickup { border-left: 4px solid #007aff; }
        .metric-box.return { border-left: 4px solid #34c759; }
        .metric-box.yesterday-pickup { border-left: 4px solid #5856d6; }
        .metric-box.yesterday-return { border-left: 4px solid #ff9500; }

        .metric-label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: #8e8e93; margin-bottom: 4px; }
        .metric-value { font-size: 26px; font-weight: 700; color: #1c1c1e; }

        /* Daily Scan View Styles */
        .daily-content { padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
        .mode-row, .action-row { display: flex; gap: 10px; }
        .mode-btn { flex: 1; height: 48px; border-radius: 14px; border: 2px solid; font-weight: 700; background: #fff; cursor: pointer; transition: .2s; font-size: 15px; }
        .pickup { border-color: #007aff; color: #007aff; }
        .return { border-color: #34c759; color: #34c759; }
        .active-pickup { background: #007aff; color: #fff; }
        .active-return { background: #34c759; color: #fff; }

        .scan-panel { display: none; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid #e5e5ea; border-radius: 18px; background: #f9f9fb; }
        .input { height: 46px; padding: 0 14px; border: 1px solid #d1d1d6; border-radius: 12px; outline: none; background: #fff; font-size: 14px; width: 100%; }
        .input:focus { border-color: #007aff; box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.15); }
        #reader { display: none; width: 100%; overflow: hidden; border-radius: 14px; border: 1px dashed #8e8e93; }

        .result-card { padding: 14px; border: 1px solid #e5e5ea; border-radius: 14px; background: #fff; display: none; font-size: 13px; line-height: 1.6; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        .data-table td { padding: 4px 0; border-bottom: 1px solid #f2f2f7; }
        .data-table td.label { color: #8e8e93; font-weight: 500; width: 35%; }
        .data-table td.val { color: #1c1c1e; font-weight: 600; }

        .btn { border: none; border-radius: 12px; padding: 12px 16px; font-size: 14px; font-weight: 600; cursor: pointer; transition: .2s; text-align: center; }
        .btn-camera { background: #007aff; color: #fff; }
        .btn-manual { background: #636366; color: #fff; }
        .btn-save { background: #34c759; color: #fff; }
        .btn-stop { background: #ff3b30; color: #fff; }
        
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.85); color: #fff; padding: 10px 18px; border-radius: 20px; z-index: 9999; font-size: 13px; font-weight: 500; backdrop-filter: blur(10px); }
        #loadingOverlay { display: none; position: absolute; inset: 0; background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(8px); z-index: 999; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; color: #007aff; }
    </style>
</head>

<body>

    <div class="ios-wrapper">
        
        <!-- PAGE 1: iOS INDEX DASHBOARD -->
        <div id="indexPage" class="page-view">
            <div class="ios-header">
                <div class="ios-title">HARSIDHI VENTURES</div>
                <button class="ios-btn-icon" onclick="fetchCounts()">🔄 Refresh</button>
            </div>
            
            <div class="index-content">
                <div class="ios-section-label">Operations Overview</div>
                
                <!-- CLICKABLE RECTANGLE TAB (Opens Daily Scan) -->
                <div class="ios-dashboard-card" onclick="openDailyScan()">
                    <div class="card-top-row">
                        <div class="card-title">📦 Scan Operations</div>
                        <div class="card-badge-open">Tap to Scan ➔</div>
                    </div>

                    <div class="metrics-grid">
                        <div class="metric-box pickup">
                            <div class="metric-label">Today Pickup</div>
                            <div id="cntTodayPickup" class="metric-value">0</div>
                        </div>
                        <div class="metric-box return">
                            <div class="metric-label">Today Return</div>
                            <div id="cntTodayReturn" class="metric-value">0</div>
                        </div>
                        <div class="metric-box yesterday-pickup">
                            <div class="metric-label">Yesterday Pickup</div>
                            <div id="cntYesterdayPickup" class="metric-value">0</div>
                        </div>
                        <div class="metric-box yesterday-return">
                            <div class="metric-label">Yesterday Return</div>
                            <div id="cntYesterdayReturn" class="metric-value">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- PAGE 2: DAILY.HTML SCAN PANEL -->
        <div id="dailyPage" class="page-view page-hidden-right">
            <div class="ios-header">
                <button class="ios-btn-icon" onclick="openIndex()">⬅ Back</button>
                <div class="ios-title">DAILY SCAN</div>
                <button class="ios-btn-icon" onclick="refreshDaily()">🔄 Refresh</button>
            </div>

            <div class="daily-content">
                <div class="mode-row">
                    <button id="pickupBtn" class="mode-btn pickup" onclick="selectType('Pickup')">Pickup</button>
                    <button id="returnBtn" class="mode-btn return" onclick="selectType('Return')">Return</button>
                </div>

                <div id="scanPanel" class="scan-panel">
                    <div class="action-row">
                        <button class="btn btn-camera" style="flex: 1;" onclick="startCamera()">📷 Camera Scan</button>
                        <button class="btn btn-manual" style="flex: 1;" onclick="focusAWB()">⌨ Manual Input</button>
                    </div>
                    <div id="reader"></div>
                    <input id="awbInput" class="input" placeholder="Scan AWB or Type & Press Enter" autocomplete="off">
                    <input id="orderInput" class="input" placeholder="Order ID (Manual Fallback)" style="display: none;" autocomplete="off">
                    
                    <div id="resultCard" class="result-card"></div>
                    
                    <div class="action-row" style="margin-top: 5px;">
                        <button class="btn btn-save" style="flex: 1;" onclick="saveEntry()">Next (Save)</button>
                        <button class="btn btn-stop" style="flex: 1;" onclick="stopWork()">Stop</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loader Overlay -->
        <div id="loadingOverlay">Processing...</div>

    </div>

    <script>
        /* ===================================
        CONFIG
        =================================== */
        const API_URL = "https://script.google.com/macros/s/AKfycbzxbpxru4kVp6G6FDRh_4Pja_MDHeNSQN_NiBCtbleIlQ6HvQfHCYyfx3O6HZqDCjR-/exec"; // Apni Apps Script URL yahan dalein

        let currentType = "";
        let currentTracking = null;
        let html5QrCode = null;
        let scannerBuffer = "";
        
        const beep = new Audio("https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg");

        /* ===================================
        NAVIGATION LOGIC
        =================================== */
        function openDailyScan() {
            document.getElementById("indexPage").className = "page-view page-hidden-left";
            document.getElementById("dailyPage").className = "page-view";
        }

        function openIndex() {
            stopCamera();
            fetchCounts();
            document.getElementById("dailyPage").className = "page-view page-hidden-right";
            document.getElementById("indexPage").className = "page-view";
        }

        /* ===================================
        FETCH DASHBOARD COUNTS
        =================================== */
        async function fetchCounts() {
            try {
                const res = await fetch(`${API_URL}?action=getDashboardCounts`);
                const data = await res.json();
                if (data && data.success) {
                    document.getElementById("cntTodayPickup").innerText = data.todayPickup || 0;
                    document.getElementById("cntTodayReturn").innerText = data.todayReturn || 0;
                    document.getElementById("cntYesterdayPickup").innerText = data.yesterdayPickup || 0;
                    document.getElementById("cntYesterdayReturn").innerText = data.yesterdayReturn || 0;
                }
            } catch (err) {
                console.error(err);
            }
        }

        /* ===================================
        DAILY SCAN OPERATIONS
        =================================== */
        async function refreshDaily() {
            await stopCamera();
            currentType = "";
            clearForm();
            document.getElementById("scanPanel").style.display = "none";
            document.getElementById("pickupBtn").classList.remove("active-pickup");
            document.getElementById("returnBtn").classList.remove("active-return");
            toast("Form Refreshed");
        }

        function selectType(type) {
            currentType = type;
            document.getElementById("scanPanel").style.display = "flex";
            document.getElementById("pickupBtn").classList.remove("active-pickup");
            document.getElementById("returnBtn").classList.remove("active-return");

            if (type === "Pickup") {
                document.getElementById("pickupBtn").classList.add("active-pickup");
            } else {
                document.getElementById("returnBtn").classList.add("active-return");
            }

            clearForm();
            focusAWB();
        }

        function clearForm() {
            currentTracking = null;
            document.getElementById("awbInput").value = "";
            document.getElementById("orderInput").value = "";
            document.getElementById("orderInput").style.display = "none";
            document.getElementById("resultCard").style.display = "none";
            document.getElementById("resultCard").innerHTML = "";
        }

        function focusAWB() {
            document.getElementById("awbInput").focus();
        }

        async function startCamera() {
            try {
                if (html5QrCode) await stopCamera();
                document.getElementById("reader").style.display = "block";
                html5QrCode = new Html5Qrcode("reader");
                
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 20, qrbox: { width: 280, height: 140 } },
                    function(decodedText) {
                        document.getElementById("awbInput").value = decodedText;
                        playSuccessSound();
                        stopCamera();
                        trackShipment();
                    }
                );
            } catch (err) {
                toast("Camera Permission Error");
            }
        }

        async function stopCamera() {
            try {
                if (html5QrCode) {
                    await html5QrCode.stop();
                    await html5QrCode.clear();
                    html5QrCode = null;
                }
            } catch (err) {}
            document.getElementById("reader").style.display = "none";
        }

        document.getElementById("awbInput").addEventListener("keydown", function(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                trackShipment();
            }
        });

        document.addEventListener("keydown", function(e) {
            if (document.activeElement.id !== "awbInput") return;
            
            if (e.key === "Enter") {
                e.preventDefault();
                const awb = scannerBuffer.trim();
                if (awb.length > 5) {
                    document.getElementById("awbInput").value = awb;
                    trackShipment();
                }
                scannerBuffer = "";
                return;
            }

            if (e.key.length === 1) {
                scannerBuffer += e.key;
            }
        });

        async function trackShipment() {
            const awb = document.getElementById("awbInput").value.trim();
            if (!awb) {
                toast("Please Scan/Enter AWB");
                return;
            }

            showLoader();
            try {
                const response = await fetch(`${API_URL}?action=trackShipment&awb=${encodeURIComponent(awb)}`);
                const result = await response.json();
                hideLoader();

                if (result && result.success) {
                    currentTracking = result;
                    renderTrackingCard(result);
                } else {
                    openManualFallback();
                }
            } catch (err) {
                hideLoader();
                openManualFallback();
            }
        }

        function openManualFallback() {
            currentTracking = null;
            const todayStr = new Date().toLocaleDateString('en-GB');
            
            const card = document.getElementById("resultCard");
            card.style.display = "block";
            card.innerHTML = `
                <div style="color:#ff3b30; font-weight:600; border-bottom: 1px solid #e5e5ea; padding-bottom:4px; margin-bottom:6px;">⚠️ Tracking Not Found</div>
                <table class="data-table">
                    <tr><td class="label">Date:</td><td class="val">${todayStr}</td></tr>
                    <tr><td class="label">Type:</td><td class="val">${currentType}</td></tr>
                    <tr><td class="label">AWB:</td><td class="val">${document.getElementById("awbInput").value.trim()}</td></tr>
                    <tr><td class="label">Order ID:</td><td class="val" style="color:#ff3b30;">Manual Input Required</td></tr>
                    <tr><td class="label">Courier:</td><td class="val">MANUAL</td></tr>
                </table>
            `;
            document.getElementById("orderInput").style.display = "block";
            document.getElementById("orderInput").focus();
        }

        function renderTrackingCard(data) {
            const card = document.getElementById("resultCard");
            card.style.display = "block";
            const todayStr = new Date().toLocaleDateString('en-GB');

            card.innerHTML = `
                <div style="color:#34c759; font-weight:600; border-bottom: 1px solid #e5e5ea; padding-bottom:4px; margin-bottom:6px;">✅ Tracking Fetched</div>
                <table class="data-table">
                    <tr><td class="label">Date:</td><td class="val">${todayStr}</td></tr>
                    <tr><td class="label">Type:</td><td class="val">${currentType}</td></tr>
                    <tr><td class="label">AWB:</td><td class="val">${data.awb || ""}</td></tr>
                    <tr><td class="label">Order ID:</td><td class="val">${data.orderId || ""}</td></tr>
                    <tr><td class="label">Courier:</td><td class="val">${data.courier || ""}</td></tr>
                </table>
            `;
            document.getElementById("orderInput").value = data.orderId || "";
            document.getElementById("orderInput").style.display = "block";
        }

        async function saveEntry() {
            if (!currentType) {
                toast("Select Pickup / Return Mode First");
                return;
            }

            const awb = document.getElementById("awbInput").value.trim();
            if (!awb) {
                toast("AWB Missing");
                return;
            }

            const orderId = document.getElementById("orderInput").value.trim();

            const payload = {
                type: currentType,
                awb: awb,
                orderId: orderId,
                courier: currentTracking?.courier || "MANUAL",
                status: currentTracking?.status || "Pending"
            };

            showLoader();
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: "saveEntry",
                        payload: payload
                    })
                });

                const result = await response.json();
                hideLoader();

                if (result.duplicate) {
                    toast("❌ Duplicate AWB Detected!");
                    document.getElementById("awbInput").select();
                    return;
                }

                if (!result.success) {
                    toast(result.message || "Save Failed");
                    return;
                }

                playSuccessSound();
                toast("🎉 Row Saved!");
                clearForm();
                focusAWB();
            } catch (err) {
                hideLoader();
                toast("Save Error");
            }
        }

        function stopWork() {
            stopCamera();
            currentType = "";
            clearForm();
            document.getElementById("scanPanel").style.display = "none";
            document.getElementById("pickupBtn").classList.remove("active-pickup");
            document.getElementById("returnBtn").classList.remove("active-return");
            toast("Process Reset");
        }

        function showLoader() { document.getElementById("loadingOverlay").style.display = "flex"; }
        function hideLoader() { document.getElementById("loadingOverlay").style.display = "none"; }
        function playSuccessSound() { try { beep.currentTime = 0; beep.play(); } catch (err) {} }
        function toast(msg) {
            const t = document.createElement("div");
            t.className = "toast"; t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        window.onload = function() {
            fetchCounts();
        };
    </script>
</body>

</html>
