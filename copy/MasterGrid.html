<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Data Grid</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f8fafc; color: #0f172a; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .top-bar a { text-decoration: none; color: #2563eb; font-weight: 600; font-size: 13px; }
        .table-panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,.02); }
        .table-wrapper { overflow-x: auto; max-height: 500px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th { background: #f1f5f9; color: #475569; font-weight: 600; padding: 12px 14px; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; }
        td { padding: 10px 14px; border-bottom: 1px solid #f1f5f9; color: #334155; }
        .pagination { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: #fafbfc; border-top: 1px solid #e2e8f0; font-size: 13px; }
        .btn { border: none; border-radius: 8px; padding: 8px 14px; font-size: 12px; font-weight: 600; cursor: pointer; }
        .btn-primary { background: #2563eb; color: #fff; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="?">← Back to Dashboard</a>
            <span style="font-weight:700; font-size:14px; color:#2563eb;">MASTER DATA GRID</span>
        </div>
        <div class="table-panel">
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr><th>Row</th><th>Date</th><th>Type</th><th>AWB</th><th>Order ID</th><th>Courier</th><th>Status</th><th>Action</th></tr>
                    </thead>
                    <tbody id="gridBody">
                        <tr><td colspan="8" style="text-align:center; padding:20px;">Loading grid records...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="pagination">
                <div>Page <b id="pageTxt">1</b> of <b id="totalPageTxt">1</b></div>
                <div>
                    <button class="btn" onclick="changePage(-1)">Prev</button>
                    <button class="btn" onclick="changePage(1)">Next</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1, totalPages = 1;

        function loadData() {
            google.script.run.withSuccessHandler(res => {
                if (!res.success) return;
                totalPages = res.totalPages || 1;
                document.getElementById("pageTxt").innerText = res.currentPage;
                document.getElementById("totalPageTxt").innerText = totalPages;
                
                let html = "";
                (res.rows || []).forEach(r => {
                    html += `<tr>
                        <td><b>#${r.row}</b></td><td>${r.date}</td><td>${r.type}</td>
                        <td><code>${r.awb}</code></td><td>${r.orderId || "-"}</td><td>${r.courier || "-"}</td>
                        <td><b style="color:#2563eb;">${r.status || "Pending"}</b></td>
                        <td><button class="btn btn-primary" onclick="syncRow('${r.awb}')">Sync</button></td>
                    </tr>`;
                });
                document.getElementById("gridBody").innerHTML = html || `<tr><td colspan="8" style="text-align:center;">No records</td></tr>`;
            }).getPaginatedRecords(currentPage, 100);
        }

        function syncRow(awb) {
            toast("Syncing row...");
            google.script.run.withSuccessHandler(res => {
                toast(res.success ? "🎉 Row updated" : "Sync error");
                loadData();
            }).updateSingleAWB(awb);
        }

        function changePage(dir) {
            if (currentPage + dir >= 1 && currentPage + dir <= totalPages) {
                currentPage += dir; loadData();
            }
        }

        function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.innerText = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2500); }
        window.onload = loadData;
    </script>
</body>
</html>
