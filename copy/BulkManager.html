<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Bulk Packet Data Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f8fafc; color: #0f172a; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .top-bar a { text-decoration: none; color: #2563eb; font-weight: 600; font-size: 13px; }
        .filter-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: flex-end; margin-bottom: 20px; }
        .input { height: 42px; padding: 0 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; width: 100%; }
        .btn { border: none; border-radius: 8px; height: 42px; padding: 0 16px; font-size: 13px; font-weight: 600; cursor: pointer; background: #2563eb; color: #fff; }
        .btn-live { background: #16a34a; }
        .table-panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th { background: #f1f5f9; padding: 12px; border-bottom: 1px solid #e2e8f0; }
        td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="?">← Back to Dashboard</a>
            <span style="font-weight:700; font-size:14px; color:#2563eb;">BULK PACKET MANAGER</span>
        </div>
        <div class="filter-card">
            <div><label style="font-size:12px; font-weight:600;">Date</label><input type="date" id="fDate" class="input"></div>
            <div>
                <label style="font-size:12px; font-weight:600;">Type</label>
                <select id="fType" class="input"><option value="pickup">Pickup</option><option value="return">Return</option></select>
            </div>
            <button id="actBtn" class="btn" onclick="handleBtn()">Fetch Bulk Data</button>
        </div>
        <div class="table-panel">
            <table>
                <thead><tr><th>Row</th><th>AWB</th><th>Order ID</th><th>Realtime Live Status</th></tr></thead>
                <tbody id="bulkBody"><tr><td colspan="4" style="text-align:center; padding:20px; color:#64748b;">Select date and type to fetch rows.</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        let rowsCache = [], isLoaded = false;

        function convertDate(d) { if (!d) return ""; const p = d.split("-"); return `${p[2]}/${p[1]}/${p[0]}`; }

        function handleBtn() {
            if (!isLoaded) fetchRows();
            else runLiveSync();
        }

        function fetchRows() {
            const rawD = document.getElementById("fDate").value;
            const type = document.getElementById("fType").value;
            if (!rawD) return toast("Select Date");

            google.script.run.withSuccessHandler(res => {
                if (res.success && res.rows && res.rows.length) {
                    rowsCache = res.rows; isLoaded = true;
                    document.getElementById("actBtn").innerText = "Get Live Status Data";
                    document.getElementById("actBtn").classList.add("btn-live");
                    let html = "";
                    rowsCache.forEach(r => {
                        html += `<tr><td><b>#${r.row}</b></td><td>${r.awb}</td><td>${r.orderId || "N/A"}</td><td id="live-${r.awb}">Pending Sync</td></tr>`;
                    });
                    document.getElementById("bulkBody").innerHTML = html;
                } else toast("No rows found for selected date.");
            }).getBulkRows(convertDate(rawD), type);
        }

        async function runLiveSync() {
            for (let i = 0; i < rowsCache.length; i++) {
                const item = rowsCache[i];
                const cell = document.getElementById(`live-${item.awb}`);
                if (cell) cell.innerText = "Tracking Live...";
                
                await new Promise(resolve => {
                    google.script.run.withSuccessHandler(res => {
                        if (cell) cell.innerText = res.success ? (res.skipped ? `Skipped (${res.reason})` : "✅ Updated") : "❌ Error";
                        resolve();
                    }).updateSingleAWB(item.awb);
                });
            }
            toast("🎉 Bulk Sync Complete!"); isLoaded = false;
            document.getElementById("actBtn").innerText = "Fetch Bulk Data";
            document.getElementById("actBtn").classList.remove("btn-live");
        }

        function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.innerText = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2500); }
    </script>
</body>
</html>
