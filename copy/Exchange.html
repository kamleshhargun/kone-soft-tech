<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exchange Request Lifecycle Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f8fafc; color: #0f172a; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .top-bar a { text-decoration: none; color: #2563eb; font-weight: 600; font-size: 13px; }
        .header-panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .btn { border: none; border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; background: #2563eb; color: #fff; }
        .table-panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th { background: #f1f5f9; padding: 12px; border-bottom: 1px solid #e2e8f0; }
        td { padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <a href="?">← Back to Dashboard</a>
            <span style="font-weight:700; font-size:14px; color:#2563eb;">EXCHANGE MANAGEMENT</span>
        </div>
        <div class="header-panel">
            <h3>🔄 Customer Exchange Request Lifecycle</h3>
            <button class="btn" onclick="addRequest()">+ New Request</button>
        </div>
        <div class="table-panel">
            <table>
                <thead><tr><th>Date</th><th>Order ID</th><th>Mobile</th><th>Original AWB</th><th>Status</th></tr></thead>
                <tbody id="exBody"><tr><td colspan="5" style="text-align:center; padding:20px;">Loading exchange requests...</td></tr></tbody>
            </table>
        </div>
    </div>

    <script>
        function loadEx() {
            google.script.run.withSuccessHandler(res => {
                if (!res.success) return;
                let html = "";
                (res.requested || []).forEach(r => {
                    html += `<tr><td>${r.date}</td><td><b>${r.orderId}</b></td><td>${r.mobile}</td><td><code>${r.originalAwb}</code></td><td>${r.status}</td></tr>`;
                });
                document.getElementById("exBody").innerHTML = html || `<tr><td colspan="5" style="text-align:center;">No active requests</td></tr>`;
            }).getExchangeReport();
        }

        function addRequest() {
            const o = prompt("Enter Order ID:"), m = prompt("Enter Mobile:"), a = prompt("Enter Original AWB:");
            if (!o || !m || !a) return toast("All fields required");
            
            google.script.run.withSuccessHandler(res => {
                toast(res.success ? "🎉 Registered!" : "Error");
                loadEx();
            }).addExchangeRequest({ orderId: o, mobile: m, originalAwb: a, description: "Manual Add" });
        }

        function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.innerText = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2500); }
        window.onload = loadEx;
    </script>
</body>
</html>
