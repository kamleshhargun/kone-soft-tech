<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Scan Operations</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #0f172a; padding: 16px; }
        .main-container { width: 100%; max-width: 520px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .top-bar a { text-decoration: none; color: #2563eb; font-weight: 600; font-size: 13px; }
        .panel { background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 12px rgba(0, 0, 0, .03); }
        .panel-header { padding: 14px 16px; background: #f1f5f9; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 13px; }
        .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; background: #fff; border: 1px solid #cbd5e1; font-size: 12px; }
        .circle-count { width: 20px; height: 20px; border-radius: 50%; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
        .center-content { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
        .mode-row { display: flex; gap: 10px; }
        .mode-btn { flex: 1; height: 48px; border-radius: 10px; border: 2px solid; font-weight: 700; background: #fff; cursor: pointer; transition: .2s; font-size: 14px; }
        .pickup { border-color: #2563eb; color: #2563eb; }
        .return { border-color: #0d9488; color: #0d9488; }
        .active-pickup { background: #2563eb; color: #fff; }
        .active-return { background: #0d9488; color: #fff; }
        .scan-panel { display: none; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid #e2e8f0; border-radius: 12px; background: #f8fafc; }
        .input { height: 46px; padding: 0 14px; border: 1px solid #cbd5e1; border-radius: 10px; outline: none; background: #fff; font-size: 14px; width: 100%; }
        .input:focus { border-color: #2563eb; }
        #reader { display: none; width: 100%; border-radius: 10px; overflow: hidden; border: 1px dashed #cbd5e1; }
        .result-card { padding: 12px; border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; font-size: 13px; display: none; }
        .btn { border: none; border-radius: 10px; padding: 12px 16px; font-size: 14px; font-weight: 600; cursor: pointer; transition: .2s; text-align: center; }
        .btn-camera { background: #2563eb; color: #fff; }
        .btn-manual { background: #475569; color: #fff; }
        .btn-save { background: #16a34a; color: #fff; }
        .btn-stop { background: #dc2626; color: #fff; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; z-index: 999; }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="top-bar">
            <a href="?">← Back to Dashboard</a>
            <span style="font-weight:700; font-size:14px; color:#2563eb;">LIVE SCANNER</span>
        </div>
        <div class="panel">
            <div class="panel-header">
                <div class="badge" style="color: #2563eb;">Pickup <span id="headerPickupCount" class="circle-count" style="background:#2563eb;">0</span></div>
                <span>📲 Scan Terminal</span>
                <div class="badge" style="color: #0d9488;">Return <span id="headerReturnCount" class="circle-count" style="background:#0d9488;">0</span></div>
            </div>
            <div class="center-content">
                <div class="mode-row">
                    <button id="pickupBtn" class="mode-btn pickup" onclick="selectType('Pickup')">Pickup Mode</button>
                    <button id="returnBtn" class="mode-btn return" onclick="selectType('Return')">Return Mode</button>
                </div>
                <div id="scanPanel" class="scan-panel">
                    <div style="display:flex; gap:10px;">
                        <button class="btn btn-camera" style="flex:1;" onclick="startCamera()">📷 Camera Scan</button>
                        <button class="btn btn-manual" style="flex:1;" onclick="focusAWB()">⌨ Manual Focus</button>
                    </div>
                    <div id="reader"></div>
                    <input id="awbInput" class="input" placeholder="Scan AWB or Type & Press Enter">
                    <input id="orderInput" class="input" placeholder="Order ID (Fallback)" style="display: none;">
                    <div id="resultCard" class="result-card"></div>
                    <div style="display:flex; gap:10px;">
                        <button class="btn btn-save" style="flex:1;" onclick="saveEntry()">Next (Save)</button>
                        <button class="btn btn-stop" style="flex:1;" onclick="stopWork()">Stop</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentType = "", currentTracking = null, html5QrCode = null;

        function selectType(type) {
            currentType = type;
            document.getElementById("scanPanel").style.display = "flex";
            document.getElementById("pickupBtn").className = "mode-btn pickup " + (type === "Pickup" ? "active-pickup" : "");
            document.getElementById("returnBtn").className = "mode-btn return " + (type === "Return" ? "active-return" : "");
            clearForm(); focusAWB();
        }

        function clearForm() {
            currentTracking = null;
            document.getElementById("awbInput").value = "";
            document.getElementById("orderInput").value = "";
            document.getElementById("orderInput").style.display = "none";
            document.getElementById("resultCard").style.display = "none";
        }

        function focusAWB() { document.getElementById("awbInput").focus(); }

        async function startCamera() {
            if (html5QrCode) await stopCamera();
            document.getElementById("reader").style.display = "block";
            html5QrCode = new Html5Qrcode("reader");
            await html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: { width: 250, height: 130 } }, decodedText => {
                document.getElementById("awbInput").value = decodedText;
                stopCamera(); trackShipment();
            });
        }

        async function stopCamera() {
            if (html5QrCode) { await html5QrCode.stop(); html5QrCode = null; }
            document.getElementById("reader").style.display = "none";
        }

        document.getElementById("awbInput").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); trackShipment(); } });

        function trackShipment() {
            const awb = document.getElementById("awbInput").value.trim();
            if (!awb) return toast("Enter AWB First");
            
            google.script.run.withSuccessHandler(res => {
                if (res && res.success) {
                    currentTracking = res;
                    document.getElementById("resultCard").style.display = "block";
                    document.getElementById("resultCard").innerHTML = `<b>✅ Fetched:</b> ${res.courier} | Order: ${res.orderId || "N/A"}`;
                    document.getElementById("orderInput").value = res.orderId || "";
                    document.getElementById("orderInput").style.display = "block";
                } else {
                    document.getElementById("resultCard").style.display = "block";
                    document.getElementById("resultCard").innerHTML = `<span style="color:#dc2626;">⚠️ Tracking Not Found - Enter Order ID manually</span>`;
                    document.getElementById("orderInput").style.display = "block";
                }
            }).trackShipment(awb);
        }

        function saveEntry() {
            const awb = document.getElementById("awbInput").value.trim();
            if (!awb || !currentType) return toast("Missing AWB or Mode");

            const payload = {
                type: currentType, awb: awb, orderId: document.getElementById("orderInput").value.trim(),
                courier: currentTracking?.courier || "MANUAL", status: currentTracking?.status || "Pending",
                customerName: currentTracking?.customerName || "", city: currentTracking?.city || "",
                state: currentTracking?.state || "", destination: currentTracking?.destination || "",
                pickupDate: currentTracking?.pickupDate || "", deliveredDate: currentTracking?.deliveredDate || "",
                expectedDate: currentTracking?.expectedDate || "", isRTO: currentTracking?.isRTO || false
            };

            google.script.run.withSuccessHandler(res => {
                if (res.duplicate) toast("❌ Blocked: Duplicate AWB!");
                else if (res.success) { toast("🎉 Saved!"); clearForm(); loadCounts(); focusAWB(); }
                else toast(res.message || "Save Error");
            }).saveEntry(payload);
        }

        function stopWork() { stopCamera(); clearForm(); document.getElementById("scanPanel").style.display = "none"; }
        function loadCounts() {
            google.script.run.withSuccessHandler(res => {
                if (res.success) {
                    document.getElementById("headerPickupCount").innerText = res.todayPickup || 0;
                    document.getElementById("headerReturnCount").innerText = res.todayReturn || 0;
                }
            }).getDashboardCounts();
        }
        function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.innerText = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2500); }
        window.onload = loadCounts;
    </script>
</body>
</html>
